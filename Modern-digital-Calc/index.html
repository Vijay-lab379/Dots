<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <title>Calc</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Digital Calculator</h1>
    <div class="Calc">
        <h1 class="display"> Welcome</h1>
        <ul class="command">
            <li>√</li>
            <li>(</li>
            <li>)</li>
            <li>Del</li>
            <li style="color: rgb(255, 221, 4);">AC</li>
        </ul>
        <ul class="number">
            <li>1</li>
            <li>2</li>
            <li>3</li>
            <li>4</li>
            <li>5</li>
            <li>6</li>
            <li>7</li>
            <li>8</li>
            <li>9</li>
            <li>00</li>
            <li>0</li>
            <li>.</li>
        </ul>
        <ul class="operator">
            <li>+</li>
            <li>-</li>
            <li>*</li>
            <li>/</li>
            <li>%</li>
            <li>log</li>
            <li id="Ans">=</li>
        </ul>
    </div>
    <i style="text-align: center; font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;">&copy
        Created By Vjiay B. </i>

        <i class="fa-brands fa-github-alt"></i></a>
    <a id="in" href="https://www.linkedin.com/in/vijay-b-a3a9a3363/" target="_blank">
        <i class="fa-brands fa-linkedin"></i>
    </a>
    <script src="calc.js"></script>
</body>

</html>
