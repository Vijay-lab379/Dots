<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="Calc">
        <h1 class="display"> <i>Welcome</i>
        </h1>
        <div class="inputs">
            <ul class="command">
                <li>√</li>
                <li>(</li>
                <li>)</li>
                <li style="font-size: 19px;">Del</li>
                <li style="background-color: rgb(255, 187, 61);">AC</li>
            </ul>
            <ul class="number">
                <li>1</li>
                <li>2</li>
                <li>3</li>
                <li>4</li>
                <li>5</li>
                <li>6</li>
                <li>7</li>
                <li>8</li>
                <li>9</li>
                <li>00</li>
                <li>0</li>
                <li>.</li>
            </ul>
            <ul class="operator">
                <li>+</li>
                <li>-</li>
                <li>*</li>
                <li>/</li>
                <li>%</li>
                <li>log</li>
                <li style="width: 90px; border-radius: 24px;">=</li>
            </ul>
        </div>
    </div>
    <i style="text-align: center;">Created By Vjiay B.</i>
    <script src="calc.js"></script>

</body>

</html>
