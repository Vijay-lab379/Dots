<!-- ══ FORM PANEL — Add/Edit: Project, Task, Subtask, Member ══
     Drop this block into cl.html just before the </body> closing tag,
     above the <script src="index.js"> line.
     The auth-overlay already exists — we reuse it.
-->

<!-- Reuse existing #auth-overlay for dimming — no new overlay needed -->

<div id="form-panel">

  <div id="form-panel-inner">

    <!-- Header -->
    <div id="form-panel-header">
      <span id="form-panel-title">Add Project</span>
      <button id="form-close-btn" title="Close">×</button>
    </div>

    <!-- ── PROJECT FORM ── -->
    <div class="form-body" id="form-project" data-form="project">
      <label class="form-label" for="fp-name">Name</label>
      <input class="form-field" id="fp-name" name="name" type="text" placeholder="Project name" autocomplete="off" />

      <label class="form-label" for="fp-desc">Description</label>
      <textarea class="form-field form-textarea" id="fp-desc" name="description" placeholder="Short summary…" rows="3"></textarea>

      <div class="form-actions">
        <button class="form-btn-cancel" id="form-cancel-btn" type="button">Cancel</button>
        <button class="form-btn-submit" id="form-submit-btn" type="button">Save</button>
      </div>
    </div>

    <!-- ── TASK FORM ── -->
    <div class="form-body hidden" id="form-task" data-form="task">
      <label class="form-label" for="ft-title">Title</label>
      <input class="form-field" id="ft-title" name="title" type="text" placeholder="Task title" autocomplete="off" />

      <label class="form-label" for="ft-desc">Description</label>
      <textarea class="form-field form-textarea" id="ft-desc" name="description" placeholder="What needs to be done…" rows="3"></textarea>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="ft-status">Status</label>
          <select class="form-field form-select" id="ft-status" name="status">
            <option value="todo">To Do</option>
            <option value="in_progress">In Progress</option>
            <option value="done">Done</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" for="ft-assignee">Assign To <span class="form-hint">(username)</span></label>
          <input class="form-field" id="ft-assignee" name="assignedTo" type="text" placeholder="username" autocomplete="off" />
        </div>
      </div>

      <div class="form-actions">
        <button class="form-btn-cancel" id="form-cancel-btn" type="button">Cancel</button>
        <button class="form-btn-submit" id="form-submit-btn" type="button">Save</button>
      </div>
    </div>

    <!-- ── SUBTASK FORM ── -->
    <div class="form-body hidden" id="form-subtask" data-form="subtask">
      <label class="form-label" for="fst-title">Title</label>
      <input class="form-field" id="fst-title" name="title" type="text" placeholder="Subtask title" autocomplete="off" />

      <label class="form-label" for="fst-desc">Description</label>
      <textarea class="form-field form-textarea" id="fst-desc" name="description" placeholder="Details…" rows="3"></textarea>

      <div class="form-actions">
        <button class="form-btn-cancel" id="form-cancel-btn" type="button">Cancel</button>
        <button class="form-btn-submit" id="form-submit-btn" type="button">Save</button>
      </div>
    </div>

    <!-- ── MEMBER FORM ── -->
    <div class="form-body hidden" id="form-member" data-form="member">
      <label class="form-label" for="fm-email">Member Email</label>
      <input class="form-field" id="fm-email" name="email" type="email" placeholder="member@email.com" autocomplete="off" />

      <label class="form-label" for="fm-role">Role</label>
      <select class="form-field form-select" id="fm-role" name="role">
        <option value="member">Member</option>
        <option value="project_admin">Project Admin</option>
        <option value="admin">Admin</option>
      </select>

      <div class="form-actions">
        <button class="form-btn-cancel" id="form-cancel-btn" type="button">Cancel</button>
        <button class="form-btn-submit" id="form-submit-btn" type="button">Add Member</button>
      </div>
    </div>

    <!-- ── NOTE FORM ── -->
    <div class="form-body hidden" id="form-note" data-form="note">
      <label class="form-label" for="fn-content">Note / Comment</label>
      <textarea class="form-field form-textarea" id="fn-content" name="content" placeholder="Write your note…" rows="5"></textarea>

      <div class="form-actions">
        <button class="form-btn-cancel" id="form-cancel-btn" type="button">Cancel</button>
        <button class="form-btn-submit" id="form-submit-btn" type="button">Save</button>
      </div>
    </div>

  </div><!-- /form-panel-inner -->
</div><!-- /form-panel -->
